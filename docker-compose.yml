# Heretic LLM Abliteration Pipeline (master)
#
# Usage:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose run --rm heretic heretic google/gemma-3-12b-it
#   (select trial, save to /output/hf-model)

services:
  heretic:
    build: .
    runtime: nvidia
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:-0}
    volumes:
      - ./output:/output
      - ./models:/models
      - ./scripts:/scripts
    stdin_open: true
    tty: true
